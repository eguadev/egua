<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Programar - Linguagem Égua</title>
  <meta name="description" content="IDE online e gratuita da linguagem de programação Égua. Escreva e execute código Égua diretamente no navegador, sem instalação.">
  <link rel="canonical" href="https://programar.egua.dev/">
  <meta name="robots" content="index, follow">

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="https://egua.dev" title="Voltar ao site da Linguagem Égua">
      <img src="./assets/egua-logo.png" alt="Linguagem Égua">
      <span class="brand-name">Linguagem Égua</span>
    </a>
    <div class="topbar-actions">
      <select id="demoSelector" aria-label="Escolher exemplo"></select>
      <button id="runBtn">Executar</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel">
      <h2 class="panel-head">Editor</h2>
      <div id="editor"></div>
    </section>
    <section class="panel">
      <h2 class="panel-head">Saída</h2>
      <div id="output" aria-live="polite"></div>
    </section>
  </main>

  <!-- Linguagem Égua -->
  <script src="./js/egua.min.js"></script>

  <!-- Framework do editor do código -->
  <script src="./js/codeflask.min.js"></script>

  <!-- Core da IDE -->
  <script src="./js/demos.js"></script>
  <script src="./js/index.js"></script>
</body>

</html>
